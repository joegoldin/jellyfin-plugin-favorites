name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Favorites.Tests.csproj --configuration Release
      - run: dotnet build Jellyfin.Plugin.Favorites/Jellyfin.Plugin.Favorites.csproj --configuration Release --no-restore
      - run: python3 scripts/package.py --timestamp 2026-11-15T00:00:00Z
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: artifacts/*
